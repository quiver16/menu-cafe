<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #6e390d;
            --card-bg: #4a2508;
            --text-primary: #f8fafc;
            --text-secondary: #c9a68a;
            --accent: #f59e0b;
            --price-color: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden; /* Hide scrollbars for TV */
            height: 100vh;
            width: 100vw;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(to bottom, var(--bg-color) 80%, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 0 2rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        #menu-container {
            padding-top: 120px;
            padding-bottom: 120px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            padding-left: 4rem;
            padding-right: 4rem;
            position: absolute;
            width: 100%;
            will-change: transform;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .product-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            background-color: #334155;
        }

        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .product-name {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .product-desc {
            font-size: 1.1rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            margin-top: auto;
            display: flex;
            flex-direction: column;
        }

        .price-usd {
            font-size: 2rem;
            font-weight: 700;
            color: var(--price-color);
        }

        .price-bs {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 2rem;
            color: var(--accent);
        }

        /* Animation for scanning effect or highlights can be added here */
    </style>
</head>
<body>
    <div id="loader" class="loader">Cargando Menú...</div>

    <header class="header">
        <h1>Nuestro Menú</h1>
    </header>

    <div id="menu-scroll-wrapper" style="position: relative; height: 100vh;">
        <div id="menu-container">
            <!-- Products will be injected here -->
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://10.200.100.89:4000'; // Hardcoded for simplicity as per setup

        async function init() {
            try {
                const [productsRes, categoriesRes, dolarRes] = await Promise.all([
                    fetch(`${BACKEND_URL}/products`).then(r => r.json()),
                    fetch(`${BACKEND_URL}/categories`).then(r => r.json()),
                    fetch(`${BACKEND_URL}/dolar`).then(r => r.json())
                ]);

                const dolar = dolarRes[0]?.Factor || 0;
                const container = document.getElementById('menu-container');
                const loader = document.getElementById('loader');


                const deliveryCategory = categoriesRes.find(cat => cat.Descripcion.includes("DELIVERY"));
                const deliveryCodp = deliveryCategory ? deliveryCategory.Codp : null;

                const regexFmc = /\b(FMC|PF)\b/gi;

                // Función para mezclar el array aleatoriamente
                const shuffleArray = (array) => {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                    return array;
                };

                // Filtrar (excluir DELIVERY) y luego mezclar
                const filteredProducts = productsRes.filter(product => product.Categoria !== deliveryCodp);
                const randomizedProducts = shuffleArray([...filteredProducts]);

                const productsHTML = randomizedProducts.map(product => {
                    const cleanDescrip = product.Descrip.replace(regexFmc, "").trim();
                    const priceUSD = product.Precios[0]?.PrecioFinal || 0;
                    const priceBS = (priceUSD * dolar).toFixed(2);
                    const imageUrl = product.ImageFs ? `${BACKEND_URL}/image/${product.Codp}` : 'https://via.placeholder.com/150?text=No+Image';

                    return `
                        <div class="product-card">
                            <img src="${imageUrl}" alt="${cleanDescrip}" class="product-image">
                            <div class="product-info">
                                <div class="product-name">${cleanDescrip}</div>
                                <div class="product-desc">${product.Informacion || ''}</div>
                                <div class="product-price">
                                    <span class="price-usd">$${priceUSD.toFixed(2)}</span>
                                    <span class="price-bs">Bs. ${priceBS}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = productsHTML;
                loader.style.display = 'none';

                startAutoScroll();
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loader').innerText = 'Error al cargar el menú';
            }
        }

        function startAutoScroll() {
            const container = document.getElementById('menu-container');
            const wrapper = document.getElementById('menu-scroll-wrapper');
            
            // Clone container content to create an infinite loop effect if needed
            // But let's first implement a simple continuous scroll and reset
            
            let scrollY = 0;
            const scrollSpeed = 0.5; // Adjust for faster/slower scroll

            function step() {
                scrollY -= scrollSpeed;
                
                const containerHeight = container.offsetHeight;
                const viewportHeight = window.innerHeight;

                // Reset to top when the end is reached
                if (Math.abs(scrollY) >= containerHeight - viewportHeight + 200) {
                    scrollY = 0;
                }

                container.style.transform = `translateY(${scrollY}px)`;
                requestAnimationFrame(step);
            }

            // Small delay before starting
            setTimeout(() => {
                requestAnimationFrame(step);
            }, 2000);
        }

        init();
    </script>
</body>
</html>
